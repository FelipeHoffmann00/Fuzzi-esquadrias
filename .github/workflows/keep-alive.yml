name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostico de rede (temporario)
        run: |
          echo "--- getent hosts ---"; getent hosts ircgwoyhvpnepvokswvo.supabase.co || true
          echo "--- nslookup ---"; nslookup ircgwoyhvpnepvokswvo.supabase.co || true
          echo "--- curl -v api.github.com ---"; curl -sv https://api.github.com -o /dev/null || true
        continue-on-error: true
      - name: Chamar a API do Supabase para evitar a pausa por inatividade
        run: |
          curl -sf --retry 5 --retry-delay 5 --retry-all-errors -v \
            "https://ircgwoyhvpnepvokswvo.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: sb_publishable_ug05TQnCpUManpwRLIq58A_vcI51ZUX"
